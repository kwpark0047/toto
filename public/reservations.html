<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>맛집 · 예약 관리</title>
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/admin.css">
<link rel="stylesheet" href="/assets/reservations.css">
</head>
<body>
<div id="nav"></div>
<main class="wrap page">
  <div class="page-head">
    <div>
      <div class="kicker">예약</div>
      <h1>예약 관리</h1>
      <p>손님은 <b>예약 신청</b>만 하고, 확정은 사장님이 직접 누릅니다. 손님용 신청 화면: <b id="reserveUrl">/reserve</b></p>
    </div>
    <div class="row" style="margin-left:auto;gap:8px">
      <button class="btn sm ghost" id="copyLink">신청 링크 복사</button>
      <button class="btn sm primary" id="addBtn">+ 예약 등록</button>
    </div>
  </div>

  <div class="stats" id="stats" style="margin-bottom:14px"></div>

  <div class="grid2" style="margin-bottom:14px;align-items:start">
    <div class="card pad">
      <div class="row between" style="margin-bottom:10px">
        <h3 style="font-size:18px" id="monthTitle">–</h3>
        <div class="row" style="gap:6px">
          <button class="btn sm ghost" id="prevMonth">←</button>
          <button class="btn sm ghost" id="todayMonth">이번 달</button>
          <button class="btn sm ghost" id="nextMonth">→</button>
        </div>
      </div>
      <div class="cal" id="cal"></div>
      <div class="small muted" style="margin-top:8px">날짜를 누르면 그날 예약이 아래에 나옵니다.</div>
    </div>
    <div class="card pad">
      <div class="row between" style="margin-bottom:10px">
        <h3 style="font-size:18px" id="dayTitle">오늘 예약</h3>
        <span class="badge line" id="dayCount">0건</span>
      </div>
      <div id="dayList"></div>
    </div>
  </div>

  <div class="card pad">
    <div class="row between" style="margin-bottom:8px">
      <h3 style="font-size:18px">다가오는 예약 (7일)</h3>
      <span class="small muted">신청·확정만</span>
    </div>
    <div id="upcoming"></div>
  </div>
</main>

<div class="sheet-back" id="back"></div>

<div class="sheet" id="resSheet" role="dialog" aria-label="예약 등록">
  <div class="sheet-head"><h3>예약 등록</h3><button class="x" data-close>✕</button></div>
  <div class="sheet-body">
    <div class="grid2">
      <div class="field"><label for="rsDate">날짜</label><input class="input" id="rsDate" type="date"></div>
      <div class="field"><label for="rsTime">시간</label><input class="input" id="rsTime" type="time" value="18:30"></div>
      <div class="field"><label for="rsParty">인원</label><input class="input" id="rsParty" type="number" min="1" max="30" value="2"></div>
      <div class="field"><label for="rsTable">테이블 (선택)</label><select class="select" id="rsTable"></select></div>
      <div class="field"><label for="rsName">이름</label><input class="input" id="rsName" maxlength="20"></div>
      <div class="field"><label for="rsPhone">연락처</label><input class="input" id="rsPhone" placeholder="010-0000-0000"></div>
    </div>
    <div class="field"><label for="rsMemo">메모 (선택)</label>
      <input class="input" id="rsMemo" maxlength="200" placeholder="예: 창가 자리, 유아 의자 1개"></div>
    <p class="small muted">사장님이 직접 넣는 예약은 바로 <b>확정</b>으로 저장됩니다.</p>
  </div>
  <div class="sheet-foot"><button class="btn primary" id="rsSave" style="width:100%">확정으로 저장</button></div>
</div>

<script src="/assets/util.js"></script>
<script src="/assets/nav.js"></script>
<script src="/assets/reservations.js"></script>
</body>
</html>
