<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>맛집 · 사장님 콘솔 — 메뉴 관리</title>
<link rel="stylesheet" href="/assets/base.css?v=20261127b">
<link rel="stylesheet" href="/assets/admin.css?v=20261127b">
<link rel="stylesheet" href="/assets/menu.css?v=20261127b">
</head>
<body>
<div id="nav"></div>
<main class="wrap page">
  <div class="page-head">
    <div>
      <div class="kicker">메뉴 운영</div>
      <h1>메뉴 관리</h1>
      <p>가격·품절·순서·사진·옵션을 바꾸면 고객 화면에 바로 반영됩니다.</p>
    </div>
    <div class="row" style="margin-left:auto; gap:8px">
      <button class="btn sm" id="catManage">카테고리 관리</button>
      <button class="btn sm primary" id="addItem">+ 메뉴 추가</button>
    </div>
  </div>
  <div class="row wrap" id="catChips" style="margin-bottom:6px"></div>
  <div id="menuSections"></div>
  <p class="small muted" style="margin-top:18px">
    사진은 JPG·PNG·WEBP 파일을 올리면 브라우저에서 폭 900px로 줄여 저장합니다.
  </p>
</main>

<div class="sheet-back" id="back"></div>

<!-- 메뉴 편집 -->
<div class="sheet wide" id="itemSheet" role="dialog" aria-label="메뉴 편집">
  <div class="sheet-head">
    <h3 id="itemTitle">메뉴 추가</h3>
    <button class="x" data-close>✕</button>
  </div>
  <div class="sheet-body">
    <div class="photo-edit">
      <div class="ph-prev" id="phPrev">📷</div>
      <div class="grow">
        <label class="btn sm block" for="phFile" style="cursor:pointer">사진 선택</label>
        <input type="file" id="phFile" accept="image/*" class="hidden">
        <p class="small muted" style="margin:8px 2px 0">사진을 바꾸지 않으면 기존 사진이 유지됩니다.</p>
        <button class="btn sm ghost hidden" id="phClear" style="margin-top:6px">사진 지우기</button>
      </div>
    </div>
    <div class="grid2">
      <div class="field">
        <label for="fName">메뉴 이름 *</label>
        <input class="input" id="fName" placeholder="예: 김치찌개">
      </div>
      <div class="field">
        <label for="fPrice">가격(원) *</label>
        <input class="input" id="fPrice" type="number" inputmode="numeric" min="0" step="100" placeholder="8000">
      </div>
    </div>
    <div class="field">
      <label for="fCat">카테고리 *</label>
      <select class="select" id="fCat"></select>
    </div>
    <div class="field">
      <label for="fDesc">설명</label>
      <textarea class="input" id="fDesc" placeholder="예: 돼지고기 김치찌개 · 공기밥은 따로 주문" style="min-height:70px"></textarea>
    </div>
    <label class="row" style="gap:8px;margin:6px 0 14px;font-weight:700">
      <input type="checkbox" id="fSoldout" style="width:22px;height:22px;accent-color:var(--brand)">
      <label class="switch" style="margin-left:8px"><input type="checkbox" id="fFeatured" style="width:22px;height:22px;accent-color:var(--brand)"> 추천</label>
      품절로 표시 (고객 화면에서 주문 불가)
    </label>

    <div class="row between" style="margin-bottom:8px">
      <b style="font-size:15.5px">기본 옵션</b>
      <button class="btn sm ghost" id="addOpt">+ 옵션 그룹</button>
    </div>
    <div class="grid2">
      <div class="field"><label for="fOrigin">원산지·주요 재료</label>
        <input class="input" id="fOrigin" maxlength="120" placeholder="예: 쌀(국내산), 계란(국내산), 김"></div>
      <div class="field"><label for="fSpice">매운맛 단계</label>
        <select class="select" id="fSpice">
          <option value="0">표시 안 함</option>
          <option value="1">1단계 · 순한맛</option>
          <option value="2">2단계 · 보통</option>
          <option value="3">3단계 · 매운맛</option>
        </select></div>
    </div>
    <div class="field"><label>알레르기 유발 재료 <span class="muted small">(해당되는 것만 체크)</span></label>
      <div id="fAllergens" class="row wrap" style="gap:6px"></div></div>
    <div class="field"><label>메뉴 번역 <span class="muted small">(선택 · 비우면 한국어 원문이 나옵니다)</span></label>
      <div id="i18nBox"></div></div>
    <div class="field"><label for="fNote">추천 문구 <span class="muted small">(선택 · 고객 화면 추천 카드에 한 줄로 나옵니다)</span></label>
      <input class="input" id="fNote" maxlength="60" placeholder="예: 오늘 가장 많이 나간 메뉴"></div>
    <div id="optEditor" class="opt-editor"></div>
    <p class="small muted" style="margin:6px 2px 0">옵션은 최대 3개 그룹까지 넣을 수 있습니다. (예: 맵기 → 순한맛/보통/매운맛)</p>
  </div>
  <div class="sheet-foot row" style="gap:8px">
    <button class="btn danger hidden" id="delItem">삭제</button>
    <button class="btn primary grow" id="saveItem">저장</button>
  </div>
</div>

<!-- 카테고리 관리 -->
<div class="sheet" id="catSheet" role="dialog" aria-label="카테고리 관리">
  <div class="sheet-head">
    <h3>카테고리 관리</h3>
    <button class="x" data-close>✕</button>
  </div>
  <div class="sheet-body">
    <div id="catList" class="cat-list"></div>
    <div class="row" style="gap:8px;margin-top:14px">
      <input class="input" id="newCatName" placeholder="새 카테고리 이름">
      <button class="btn primary" id="addCat">추가</button>
    </div>
  </div>
</div>

<script src="/assets/util.js?v=20261127b"></script>
<script src="/assets/nav.js?v=20261127b"></script>
<script src="/assets/menu.js?v=20261127b"></script>
</body>
</html>
