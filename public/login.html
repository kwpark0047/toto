<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbf7f2">
<title>맛집 · 사장님 로그인</title>
<link rel="stylesheet" href="/assets/base.css">
<style>
  body { background: radial-gradient(1000px 420px at 50% -10%, #ffe9db 0%, #fbf7f2 55%); }
  .login-wrap { max-width: 430px; margin: 0 auto; padding: 46px 16px 60px; }
  .logo { width: 70px; height: 70px; border-radius: 22px; background: var(--brand); color: #fff;
          display: grid; place-items: center; font-size: 36px; font-weight: 900; margin: 0 auto 12px; }
  h1 { text-align: center; font-size: 30px; }
  .sub { text-align: center; color: var(--muted); margin: 6px 0 22px; font-size: 15px; }
  .card.pad { padding: 20px; }
  .msg { margin-top: 10px; font-size: 15px; color: var(--red); font-weight: 700; min-height: 22px; }
  .signup { text-align: center; margin-top: 18px; font-size: 15px; }
  .signup a { color: var(--brand); font-weight: 800; text-decoration: none; }
  .hint { text-align: center; color: #a08d7d; font-size: 13px; margin-top: 22px; line-height: 1.6; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="logo" id="logo">맛</div>
  <h1 id="storeName">맛집</h1>
  <p class="sub">사장님 콘솔 로그인</p>

  <form class="card pad" id="loginForm">
    <div class="field">
      <label for="username">아이디</label>
      <input class="input" id="username" autocomplete="username" autocapitalize="none" placeholder="owner">
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input class="input" id="password" type="password" autocomplete="current-password" placeholder="비밀번호">
    </div>
    <button class="btn primary block lg" id="loginBtn" type="submit">로그인</button>
    <div class="msg" id="msg"></div>
  </form>

  <p class="signup" id="signupLine">처음이신가요? <a href="/signup">사업자 계정 만들기</a></p>
  <p class="hint">
    시제품용 로그인입니다. 외부 인증(OTP·소셜 로그인)은 붙이지 않았습니다.<br>
    고객 주문 화면(/t/…)과 웨이팅 접수는 로그인 없이 열립니다.
  </p>
</div>
<script src="/assets/util.js"></script>
<script src="/assets/login.js"></script>
</body>
</html>
