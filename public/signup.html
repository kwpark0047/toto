<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbf7f2">
<title>맛집 · 사업자 계정 만들기</title>
<link rel="stylesheet" href="/assets/base.css">
<style>
  body { background: radial-gradient(1000px 420px at 50% -10%, #ffe9db 0%, #fbf7f2 55%); }
  .join { max-width: 470px; margin: 0 auto; padding: 40px 16px 60px; }
  .logo { width: 64px; height: 64px; border-radius: 20px; background: var(--brand); color: #fff;
          display: grid; place-items: center; font-size: 32px; font-weight: 900; margin: 0 auto 12px; }
  h1 { text-align: center; font-size: 27px; }
  .sub { text-align: center; color: var(--muted); margin: 6px 0 20px; font-size: 15px; }
  .card.pad { padding: 20px; }
  .step { display: none; }
  .step.on { display: block; }
  .msg { margin-top: 10px; font-size: 15px; color: var(--red); font-weight: 700; min-height: 22px; }
  .skip { text-align: center; margin-top: 12px; }
  .skip a { color: var(--muted); font-size: 14.5px; text-decoration: underline; }
  .notes { margin: 14px 0 0; padding: 0; list-style: none; }
  .notes li { color: var(--muted); font-size: 14px; line-height: 1.6; }
  .big { font-size: 22px; font-weight: 900; }
  .cards { display: grid; gap: 10px; margin-top: 6px; }
  .pick { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border: 1.5px solid var(--line);
          border-radius: 14px; background: #fff; }
  .pick .k { font-weight: 800; }
</style>
</head>
<body>
<div class="join">
  <div class="logo" id="logo">맛</div>
  <h1>사업자 계정 만들기</h1>
  <p class="sub">두 칸만 넣으면 바로 시작합니다. 나머지는 나중에 하나씩 추가해요.</p>

  <form class="card pad" id="joinForm">
    <section class="step on" id="step1">
      <div class="field">
        <label for="storeName">매장 이름</label>
        <input class="input" id="storeName" value="맛집" maxlength="40">
      </div>
      <div class="field">
        <label for="username">아이디</label>
        <input class="input" id="username" autocomplete="username" autocapitalize="none" placeholder="예: owner">
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input class="input" id="password" type="password" autocomplete="new-password" placeholder="4자 이상">
      </div>
      <div class="field">
        <label for="password2">비밀번호 확인</label>
        <input class="input" id="password2" type="password" autocomplete="new-password" placeholder="한 번 더">
      </div>
      <button class="btn primary block lg" id="nextBtn" type="button">다음</button>
      <div class="msg" id="msg"></div>
      <ul class="notes">
        <li>· 이메일·사업자등록번호·주소는 지금 묻지 않습니다.</li>
        <li>· 직원·테이블·매장 정보는 로그인 후 '설정'에서 추가할 수 있습니다.</li>
      </ul>
    </section>

    <section class="step" id="step2">
      <p class="big">테이블이 몇 개인가요?</p>
      <p class="small muted" style="margin:4px 0 14px">숫자만 넣어 주세요. 나중에 '테이블' 화면에서 바꿀 수 있습니다.</p>
      <div class="field">
        <label for="tables">테이블 수</label>
        <input class="input" id="tables" type="number" min="1" max="50" value="8" inputmode="numeric">
      </div>
      <button class="btn primary block lg" id="finishBtn" type="button">시작하기</button>
      <div class="skip"><a href="#" id="skipBtn">건너뛰기 (기본 8개)</a></div>
      <div class="msg" id="msg2"></div>
    </section>
  </form>

  <p class="sub" style="margin-top:18px">이미 계정이 있나요? <a href="/login" style="color:var(--brand);font-weight:800">로그인</a></p>
</div>
<script src="/assets/util.js"></script>
<script src="/assets/signup.js"></script>
</body>
</html>
