<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>맛집 · 포장 주문</title>
<link rel="stylesheet" href="/assets/base.css">
<style>
  body.online { background: var(--bg); }
  .on-wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 120px; }
  .on-top { display: flex; align-items: center; gap: 10px; padding: 16px 0 6px; }
  .on-top a { text-decoration: none; font-size: 13px; font-weight: 800; color: var(--muted); }
  .on-hero { padding: 8px 0 14px; }
  .on-hero h1 { font-size: 26px; letter-spacing: -.03em; }
  .on-hero p { color: var(--muted); margin: 6px 0 0; font-size: 14px; }
  .on-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
  .on-item { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .on-item img { width: 68px; height: 68px; object-fit: cover; border-radius: 10px; background: #eee; }
  .on-item .grow { min-width: 0; }
  .on-cart { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 24px -18px rgba(0,0,0,.5); }
  .on-cart .inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .qtybox { display: flex; align-items: center; gap: 6px; }
  .qtybox button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-weight: 900; }
</style>
</head>
<body class="online">
<div class="on-wrap">
  <div class="on-top">
    <a href="/">← w-toto</a>
    <a href="/places" style="margin-left:auto">다른 매장</a>
    <a href="/login">사장님 로그인</a>
  </div>
  <header class="on-hero">
    <h1 id="onName">맛집</h1>
    <p id="onLine">포장·배달 주문</p>
  </header>

  <div id="onClosed" class="alert hidden">이 매장은 지금 온라인 주문(포장·배달)을 받지 않습니다. 매장 테이블 QR로 주문해 주세요.</div>
  <div class="on-tabs" id="onTabs"></div>
  <div id="onMenu">불러오는 중…</div>
  <div class="small muted" id="onNote" style="margin-top:12px"></div>
</div>

<div class="on-cart hidden" id="onCart">
  <div class="inner">
    <div class="grow"><b id="cartCount">0개</b> <span class="nums" id="cartTotal">0원</span></div>
    <button class="btn primary" id="cartGo">주문하기</button>
  </div>
</div>

<div class="sheet-back" id="back"></div>
<div class="sheet" id="onSheet" role="dialog" aria-label="주문서">
  <div class="sheet-head"><h3>주문서</h3><button class="x" data-close>✕</button></div>
  <div class="sheet-body">
    <div id="onSummary" class="small"></div>
    <div class="field"><label>받는 방법</label><div id="onChannels" class="row wrap" style="gap:8px"></div></div>
    <div class="field"><label for="onNameInput">이름</label><input class="input" id="onNameInput" maxlength="30" autocomplete="name"></div>
    <div class="field"><label for="onPhone">연락처</label><input class="input" id="onPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000"></div>
    <div class="field hidden" id="onAddrField"><label for="onAddr">배달 주소</label><input class="input" id="onAddr" maxlength="120"></div>
    <div class="field"><label for="onMemo">요청사항</label><input class="input" id="onMemo" maxlength="120" placeholder="예: 덜 맵게, 수저 주세요"></div>
    <div class="field"><label>결제 방법</label><div id="onPays" class="row wrap" style="gap:8px"></div>
      <div id="onBank" class="small muted hidden" style="margin-top:8px"></div>
      <div class="field hidden" id="onDepField" style="margin-top:8px"><label for="onDepositor">입금자명</label>
        <input class="input" id="onDepositor" maxlength="30" placeholder="입금할 때 쓴 이름"></div>
    </div>
    <label class="consent"><input type="checkbox" id="onConsent">
      <span>연락처를 주문 확인에 사용하는 데 동의합니다.</span></label>
    <div class="msg" id="onMsg" style="color:var(--red);font-weight:700;min-height:18px"></div>
  </div>
  <div class="sheet-foot"><button class="btn primary" id="onSubmit" style="width:100%">주문하기</button></div>
</div>

<script src="/assets/util.js"></script>
<script src="/assets/online.js"></script>
</body>
</html>
