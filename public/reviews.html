<div id="nav"></div>
<main class="wrap page">
  <div class="page-head">
    <div>
      <div class="kicker">고객의 목소리</div>

    </div>

      <label class="row small" style="gap:6px"><input type="checkbox" id="showHidden" checked> 숨김 포함</label>

    <div class="trend" id="trend"></div>

      <span class="badge line" id="countBadge">0건</span></div>
