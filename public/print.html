<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맛집 · 인쇄</title>
<link rel="stylesheet" href="/assets/base.css">
<style>
  body { background: #e9e2d8; }
  .bar { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid var(--line);
         padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .bar .grow { flex: 1; }
  #sheets { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  /* 인쇄용 종이 한 장 — 모달(.sheet) 스타일을 모두 되돌린다 */
  #sheets .sheet {
    background: #fff; box-shadow: 0 6px 22px rgba(28,25,23,.14);
    position: relative; overflow: hidden; transform: none; z-index: auto;
    max-height: none; display: block; border: 0; border-radius: 0;
    margin: 0; padding: 0; flex: none;
  }
  #sheets .sheet::before { content: none; display: none; }
  #sheets .sheet img { max-width: none; }
  .sheet img { position: absolute; object-fit: contain; }
  .hint { font-size: 13px; color: var(--muted); }
  @media print {
    body { background: #fff; }
    .bar { display: none; }
    #sheets { padding: 0; gap: 0; }
    #sheets .sheet { box-shadow: none; page-break-after: always; break-after: page; }
    #sheets .sheet:last-child { page-break-after: auto; }
  }
</style>
</head>
<body>
<div class="bar">
  <b>인쇄 미리보기</b>
  <span id="meta" class="hint"></span>
  <span class="grow"></span>
  <a class="btn sm ghost" id="pdf" href="#">PDF 내려받기</a>
  <button class="btn sm primary" id="printBtn">인쇄</button>
  <a class="btn sm ghost" href="/qr">QR 화면으로</a>
</div>
<div id="sheets"></div>
<script src="/assets/util.js"></script>
<script src="/assets/print.js"></script>
</body>
</html>
